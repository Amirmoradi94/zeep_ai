upstream bb_bot_dev {
  server bb_bot_dev:5000 max_fails=3 fail_timeout=30s;
  keepalive 16;
}

upstream bb_website_dev {
  server bb_website_dev:8080 max_fails=3 fail_timeout=30s;
  keepalive 16;
}

upstream bb_adminer_dev {
  server bb_adminer_dev:8080 max_fails=3 fail_timeout=30s;
  keepalive 16;
}

server {

    listen 44301 ;
    server_name dev.beeblue.shop;


    # Logging Configuration
    # access_log  /var/log/nginx/beeblue/access.log  main if=$loggable;
    # error_log  /var/log/nginx/beeblue/error.log  error;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; font-src 'self' data:;" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Buffer Settings
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 2 1k;
    
    # Timeout Settings
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Proxy Settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # Webhook Endpoint
    location /webhook {
        proxy_pass http://bb_bot_dev;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        error_page 502 503 504 /error.html;
    }

    # Products Endpoint
    location /products {
        proxy_pass http://bb_bot_dev;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        error_page 502 503 504 /error.html;
    }

    # Adminer Interface
    location /adminer {
        proxy_pass http://bb_adminer_dev/;
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/letsencrypt/.htpasswd;
        client_max_body_size 200M;
    }

    location / {
        proxy_pass http://bb_website_dev;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        error_page 502 503 504 /error.html;
    }

    location ~ ^/node_modules/\.vite/ {
        proxy_pass http://bb_website_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket and Socket.IO support
    location /socket.io/ {
        proxy_pass http://bb_website_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        
        # WebSocket specific timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Security Rules
    location ~ /\.ht {
        deny all;
    }
    
    location ~ /\. {
        deny all;
    }
    
    # Block common exploits
    if ($request_uri ~* "(eval\()" ) {
        return 403;
    }
    
    if ($request_uri ~* "(\.\./)" ) {
        return 403;
    }
    
    # Block SQL injections
    if ($query_string ~* "union.*select.*\(") {
        return 403;
    }
    if ($query_string ~* "concat.*\(") {
        return 403;
    }
    
    # Block file injections
    if ($query_string ~* "[a-zA-Z0-9_]=http://") {
        return 403;
    }
    if ($query_string ~* "[a-zA-Z0-9_]=(\.\.//?)+") {
        return 403;
    }
    if ($query_string ~* "[a-zA-Z0-9_]=/([a-z0-9_.]//?)+") {
        return 403;
    }
}